spring.application.name=similar-sites-finder
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.url=${REDIS_URL}
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=2000ms

# ElasticSearch
spring.elasticsearch.uris=${ES_URI:http://localhost:9200}

# External API
app.rapidapi.key=${RAPIDAPI_KEY}
app.rapidapi.host=${RAPIDAPI_HOST}
app.rapidapi.base-url=${RAPIDAPI_BASE_URL}
app.rapidapi.timeout-seconds=5
app.rapidapi.max-results=10
app.rapidapi.use-mock=false

# Cache
app.cache.ttl-hours=24
app.elasticsearch.max-results=10

# Logging
logging.level.com.recomengine=DEBUG
logging.level.org.springframework.web=INFO